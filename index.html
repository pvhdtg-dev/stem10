<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STEM 10 - Sổ Tay Tri Thức & Luyện Đề Trắc Nghiệm Toán - Lý - Hóa 10</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  
  <!-- KaTeX CDN render công thức Toán, Lý, Hóa -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex justify-center pb-24 selection:bg-indigo-500 selection:text-white">

  <!-- Mobile Container -->
  <div class="w-full max-w-md bg-slate-950 min-h-screen flex flex-col relative shadow-2xl border-x border-slate-800/80">

    <!-- Header Sticky -->
    <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md px-4 pt-4 pb-3 border-b border-slate-800/80 shadow-md">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-blue-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
            <i data-lucide="atom" class="w-5 h-5 animate-pulse"></i>
          </div>
          <div>
            <h1 class="text-base font-extrabold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
              STEM 10 Pocket
            </h1>
            <p class="text-[10px] text-slate-400 font-medium">Toán • Vật Lý • Hóa Học (GDPT 2018)</p>
          </div>
        </div>
        <button onclick="switchView('exam')" class="flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 text-white rounded-full text-xs font-bold shadow-lg shadow-indigo-600/30 active:scale-95 transition">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
          <span>Luyện Đề Thi</span>
        </button>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          id="searchInput"
          type="text" 
          placeholder="Tìm kiếm: delta, newton, orbital, sin cos..."
          class="w-full bg-slate-900/90 border border-slate-800 rounded-xl pl-10 pr-10 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner"
        />
        <button id="clearSearch" onclick="clearSearchInput()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Subject Tabs -->
      <div class="flex gap-1.5 mt-3 overflow-x-auto no-scrollbar py-0.5" id="subjectTabContainer">
        <button onclick="setSubject('all')" id="tab-all" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shadow-sm transition whitespace-nowrap">
          Tất cả
        </button>
        <button onclick="setSubject('toan')" id="tab-toan" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800/80 hover:text-slate-200 transition whitespace-nowrap">
          📐 Toán 10
        </button>
        <button onclick="setSubject('ly')" id="tab-ly" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800/80 hover:text-slate-200 transition whitespace-nowrap">
          ⚡ Vật lý 10
        </button>
        <button onclick="setSubject('hoa')" id="tab-hoa" class="tab-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800/80 hover:text-slate-200 transition whitespace-nowrap">
          🧪 Hóa học 10
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 px-4 py-4 space-y-4" id="mainContainer">
      <!-- Dynamic views (Home / Formulas / Exam) -->
    </main>

    <!-- Modal Xem Chi Tiết Bài Học -->
    <div id="lessonModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col justify-end">
      <div class="bg-slate-900 border-t border-slate-700/80 rounded-t-3xl max-h-[92vh] flex flex-col w-full max-w-md mx-auto animate-slide-up shadow-2xl">
        
        <!-- Modal Header -->
        <div class="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900/95 backdrop-blur z-10 rounded-t-3xl">
          <div id="modalSubjectBadge"></div>
          <button onclick="closeLessonModal()" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Sub Tabs inside Modal (Lý thuyết | Dạng bài | Tự luận | Trắc nghiệm) -->
        <div class="flex border-b border-slate-800 bg-slate-950/60 px-3 py-1.5 gap-1.5 overflow-x-auto no-scrollbar">
          <button onclick="switchModalTab('theory')" id="mtab-theory" class="modal-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white whitespace-nowrap transition">
            📖 Lý thuyết
          </button>
          <button onclick="switchModalTab('methods')" id="mtab-methods" class="modal-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
            💡 Dạng bài tập
          </button>
          <button onclick="switchModalTab('essays')" id="mtab-essays" class="modal-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
            ✍️ Tự luận
          </button>
          <button onclick="switchModalTab('quizzes')" id="mtab-quizzes" class="modal-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 whitespace-nowrap transition">
            🎲 Trắc nghiệm
          </button>
        </div>

        <!-- Modal Body Content -->
        <div class="p-5 overflow-y-auto space-y-4" id="modalBody">
          <!-- Dynamic Chapter details rendered here -->
        </div>

      </div>
    </div>

    <!-- Modal Báo Cáo Kết Quả Thi (Result Modal) -->
    <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm text-center space-y-4 shadow-2xl animate-scale-in">
        <div class="text-5xl" id="resultEmoji">🎉</div>
        <h2 class="text-lg font-bold text-white">Kết Quả Bài Làm</h2>
        <div class="text-4xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent" id="resultScore">
          18/20
        </div>
        <p class="text-xs text-slate-300 font-medium" id="resultMessage">Rất xuất sắc!</p>
        
        <div class="grid grid-cols-3 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-800 text-center">
          <div>
            <div class="text-base font-bold text-emerald-400" id="finalCorrect">0</div>
            <div class="text-[10px] text-slate-400">✅ Đúng</div>
          </div>
          <div>
            <div class="text-base font-bold text-rose-400" id="finalWrong">0</div>
            <div class="text-[10px] text-slate-400">❌ Sai</div>
          </div>
          <div>
            <div class="text-base font-bold text-indigo-400" id="finalPercent">0%</div>
            <div class="text-[10px] text-slate-400">📈 Tỉ lệ</div>
          </div>
        </div>

        <div class="space-y-2 pt-2">
          <button onclick="closeResultModal()" class="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-bold rounded-xl shadow-lg transition">
            Xem lại bài làm & Lời giải
          </button>
          <button onclick="closeResultModal(); generateNewExam();" class="w-full py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 hover:bg-slate-700 transition flex items-center justify-center gap-1.5">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
            <span>Làm đề ngẫu nhiên mới</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 flex justify-center pointer-events-none">
      <div class="w-full max-w-md bg-slate-950/95 backdrop-blur-md border-t border-slate-800/80 flex justify-around py-2.5 px-4 text-[11px] shadow-2xl pointer-events-auto">
        <button onclick="switchView('home')" id="bnav-home" class="bnav-btn flex flex-col items-center gap-1 text-indigo-400 font-bold transition">
          <i data-lucide="book-open" class="w-5 h-5"></i>
          <span>Chương học</span>
        </button>
        <button onclick="switchView('formulas')" id="bnav-formulas" class="bnav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="sigma" class="w-5 h-5"></i>
          <span>Công thức</span>
        </button>
        <button onclick="switchView('exam')" id="bnav-exam" class="bnav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="award" class="w-5 h-5"></i>
          <span>Luyện đề thi</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
